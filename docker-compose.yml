services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${PIRO_MSSQL_SA_PASSWORD:-P1ro!LocalDev}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20
  solr:
    build:
      context: .
      dockerfile: piro-solr/Dockerfile
    platform: linux/amd64
    ports:
      - "8983:8983"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8983/solr/admin/cores?action=STATUS",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  mock-oauth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    platform: linux/amd64
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
      # Pin the issuer so the browser and the api container agree on it.
      # Any username typed at the login form becomes `sub` / `preferred_username`.
      # The `groups` claim mirrors AD_SECURITY_GROUP so group-based auth tests have
      # something realistic to match on.
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "piro",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "scope",
                  "match": "openid",
                  "claims": {
                    "sub": "{{login}}",
                    "preferred_username": "{{login}}",
                    "email": "{{login}}@ccf.org.local",
                    "groups": ["GS-CC-LABMD-APPS-Piro-DEV"],
                    "roles": ["USER"]
                  }
                }
              ]
            }
          ]
        }
    healthcheck:
      # The mock-oauth2-server image is distroless (no shell, no wget/curl,
      # no /dev/tcp), so any exec-based healthcheck fails with
      # `exec: "/bin/sh": no such file or directory`. Disable the healthcheck
      # entirely and use `service_started` on the api's depends_on instead.
      disable: true
  sample-data:
    build:
      context: .
      dockerfile: piro-sample-data/Dockerfile
    platform: linux/amd64
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: 1433
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: ${PIRO_MSSQL_SA_PASSWORD:-P1ro!LocalDev}
      SQLSERVER_DB: PIRO
      PIRO_BOOTSTRAP_DB: ${PIRO_BOOTSTRAP_DB:-true}
      PIRO_FORCE_RESET: ${PIRO_FORCE_RESET:-true}
      PIRO_LOAD_SAMPLE_DATA: ${PIRO_LOAD_SAMPLE_DATA:-false}
      SOLR_URL: http://solr:8983/solr
      PIRO_SAMPLE_USER_NUID: ${PIRO_SAMPLE_USER_NUID:-}
      PIRO_SAMPLE_USER_FIRST_NAME: ${PIRO_SAMPLE_USER_FIRST_NAME:-}
      PIRO_SAMPLE_USER_LAST_NAME: ${PIRO_SAMPLE_USER_LAST_NAME:-}
      PIRO_SAMPLE_USER_ROLE: ${PIRO_SAMPLE_USER_ROLE:-USER}
    depends_on:
      sqlserver:
        condition: service_healthy
      solr:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: piro-api
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      PROJECT_NAME: PIRO
      PROJECT_VERSION: "1.0.0"
      DATABASE: MSSQL
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${PIRO_MSSQL_SA_PASSWORD:-P1ro!LocalDev}
      MSSQL_SERVER: sqlserver
      MSSQL_DB: PIRO
      MSSQL_WINDOW_AUTH: "False"
      MSSQL_DRIVER: ODBC Driver 18 for SQL Server
      ACCESS_TOKEN_SECRET_KEY: ${PIRO_ACCESS_TOKEN_SECRET:-change-me}
      ACCESS_TOKEN_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 300
      # ACCESS_TOKEN_TEST_USER deliberately has no default—set it explicitly for temporary local bypass only.
      ACCESS_TOKEN_TEST_USER: ${ACCESS_TOKEN_TEST_USER:-}
      API_CORS: http://localhost:8080
      SOLR_URL: http://solr:8983/solr
      SOLR_CORE: PIROCase
      SOLR_SUGGEST_COMMENT: PIROSuggestComment/suggest?q=
      SOLR_SUGGEST_STAFF: PIROSuggestStaff/suggest?q=
      SOLR_SUGGEST_CASE: PIROSuggestCase/suggest?q=
      SOLR_USER_NAME: ""
      SOLR_USER_PASSWORD: ""
      AD_LDAP_PATH: ${AD_LDAP_PATH:-}
      AD_SECURITY_GROUP: ${AD_SECURITY_GROUP:-}
      AD_DOMAIN: ${AD_DOMAIN:-}
      EXCEL_Template_DIRECTORY: template/
      EXCEL_Output_DIRECTORY: excel/
      EXCEL_SearchRequst_Template_FILE: PIRO_SearchRequest_Template.xlsx
      EXCEL_Cohort_MRN_Template_FILE: PIRO_Cohort_MRN_Template.xlsx
      EXCEL_Cohort_Case_Template_FILE: PIRO_Cohort_Case_Template.xlsx
      EXCEL_Cohort_EID_Template_FILE: PIRO_Cohort_EID_Template.xlsx
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-}
      AIRFLOW_DAG_COHORT_LOADER_URL: ${AIRFLOW_DAG_COHORT_LOADER_URL:-}
      AIRFLOW_CERTIFICATE: ${AIRFLOW_CERTIFICATE:-}
      # OAuth / OIDC settings. `piro-auth` must resolve to 127.0.0.1 from both
      # the browser (via the Windows hosts file) and the api container (via the
      # extra_hosts entry below). This keeps the issuer URL identical on both
      # sides so JWT validation succeeds.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://piro-auth:8888/piro}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-piro-api}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-local-dev-secret-not-a-real-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/auth/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
    extra_hosts:
      - "piro-auth:host-gateway"
    depends_on:
      sample-data:
        condition: service_completed_successfully
      mock-oauth:
        condition: service_started
    ports:
      - "8001:8001"
  ui:
    build:
      context: .
      dockerfile: piro-ui/Dockerfile
    platform: linux/amd64
    environment:
      API_BASE_URL: /api/
      IRB_DISCLAIMER_TEXT: ${PIRO_IRB_DISCLAIMER_TEXT:-}
      # Browser-facing OIDC endpoints (the UI runs in the browser, so it uses
      # the same `piro-auth` hostname resolved via the Windows hosts file).
      OIDC_ISSUER_PUBLIC: ${OIDC_ISSUER_PUBLIC:-http://piro-auth:8888/piro}
      OIDC_CLIENT_ID: ${OIDC_UI_CLIENT_ID:-piro-ui}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/auth/callback}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
volumes:
  sql_data:
