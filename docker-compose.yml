version: '3.9'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${PIRO_MSSQL_SA_PASSWORD:-P1ro!LocalDev}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q 'SELECT 1' >/dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 20
  solr:
    build:
      context: .
      dockerfile: docker/solr/Dockerfile
    platform: linux/amd64
    ports:
      - "8983:8983"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/cores?action=STATUS"]
      interval: 10s
      timeout: 5s
      retries: 10
  sample-data:
    build:
      context: .
      dockerfile: docker/sample-data/Dockerfile
    platform: linux/amd64
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: 1433
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: ${PIRO_MSSQL_SA_PASSWORD:-P1ro!LocalDev}
      SQLSERVER_DB: PIRO
      PIRO_BOOTSTRAP_DB: ${PIRO_BOOTSTRAP_DB:-true}
      PIRO_FORCE_RESET: ${PIRO_FORCE_RESET:-true}
      PIRO_LOAD_SAMPLE_DATA: ${PIRO_LOAD_SAMPLE_DATA:-false}
      SOLR_URL: http://solr:8983/solr
    depends_on:
      sqlserver:
        condition: service_healthy
      solr:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: piro-api
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      PROJECT_NAME: PIRO
      PROJECT_VERSION: "1.0.0"
      DATABASE: MSSQL
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${PIRO_MSSQL_SA_PASSWORD:-P1ro!LocalDev}
      MSSQL_SERVER: sqlserver
      MSSQL_DB: PIRO
      MSSQL_WINDOW_AUTH: "False"
      MSSQL_DRIVER: ODBC Driver 18 for SQL Server
      ACCESS_TOKEN_SECRET_KEY: ${PIRO_ACCESS_TOKEN_SECRET:-change-me}
      ACCESS_TOKEN_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 300
      ACCESS_TOKEN_TEST_USER: demo.user
      API_CORS: http://localhost:8080
      SOLR_URL: http://solr:8983/solr
      SOLR_CORE: PIROCase
      SOLR_SUGGEST_COMMENT: PIROSuggestComment/suggest?q=
      SOLR_SUGGEST_STAFF: PIROSuggestStaff/suggest?q=
      SOLR_SUGGEST_CASE: PIROSuggestCase/suggest?q=
      SOLR_USER_NAME: ""
      SOLR_USER_PASSWORD: ""
      AD_LDAP_PATH: ""
      AD_SECURITY_GROUP: ""
    depends_on:
      sample-data:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
  ui:
    build:
      context: .
      dockerfile: piro-ui/Dockerfile
    platform: linux/amd64
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
volumes:
  sql_data:
