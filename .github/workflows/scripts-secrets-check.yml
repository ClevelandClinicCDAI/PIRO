name: Scripts Secret Check

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-secrets-check.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-secrets-check.yml"
  workflow_dispatch:

jobs:
  check-scripts-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check scripts for hardcoded secrets
        run: bash scripts/check_no_hardcoded_secrets.sh
