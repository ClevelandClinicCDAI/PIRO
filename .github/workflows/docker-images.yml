name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKERHUB_ORG: piroteam

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: piro-api
            context: ./piro-api
            dockerfile: ./piro-api/Dockerfile
          - image: piro-sample-data
            context: .
            dockerfile: ./piro-sample-data/Dockerfile
          - image: piro-solr
            context: .
            dockerfile: ./piro-solr/Dockerfile
          - image: piro-ui
            context: .
            dockerfile: ./piro-ui/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and (optionally) push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_ORG }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
