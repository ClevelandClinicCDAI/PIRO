<div id="backgroundOverlay"></div>
<div class="suggestions-container " ng-reflect-klass="suggestions-container" id="suggestions-container">
	<ul>
		<li class="item" *ngFor="let item of items">
			<div><a href="javascript:void(0);" (click)="getValue(item.name)">{{item.value}}</a></div>
		</li>
	</ul>
</div>
