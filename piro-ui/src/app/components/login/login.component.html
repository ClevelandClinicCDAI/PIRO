<div id="login" class="container">
  <div class="row-fluid">
    <div class="col-md-4" style="float:none;margin:auto;">
      <div class="card shadow p-3 bg-white rounded">
        <article class="card-body">
          <h4 class="card-title text-center mb-4 mt-1">Login</h4>
          <hr>
          <p class="text-success text-center"><img src="/assets/images/cc-logo.png" alt="logo"></p>
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group  mb-3">
              <div class="input-group">
                <span class="input-group-text" id="basic-addon1"><i class="fa fa-user"></i></span>
                <input type="text" class="form-control" placeholder="Username" aria-label="Username"
                  aria-describedby="basic-addon1" formControlName="username"
                  [ngClass]="{ 'is-invalid': submitted && f.username.errors }">
              </div>
              <div *ngIf="submitted && f.username.errors" class="invalid-feedback">
                <div *ngIf="f.username.errors.required">Username is required</div>
              </div>
            </div>
            <div class="form-group mb-3">
              <div class="input-group">
                <span class="input-group-text" id="basic-addon2"><i class="fa fa-lock"></i></span>
                <input type="password" class="form-control" placeholder="******" aria-label="Password"
                  aria-describedby="basic-addon2" formControlName="password"
                  [ngClass]="{ 'is-invalid': submitted && f.password.errors }">
              </div>
              <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                <div *ngIf="f.password.errors.required">Password is required</div>
              </div>
            </div>           
            <div class="form-group">
              <button type="submit" class="btn btn-primary btn-block login_btn"> Sign In
              </button>
            </div>
          </form>
        </article>
      </div>
    </div>
  </div>
</div>
