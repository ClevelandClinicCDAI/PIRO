<form class="form-inline">

    <div class="input-group" id="dateRangePicker">
      <i class="material-icons">expand_more</i>
      <input class="form-control" id="dateRange" [placeholder]="placeholder" name="dp" [value]="formattedDateRange"
        ngbDatepicker #dp="ngbDatepicker" (dateSelect)="onDateSelection($event)" [displayMonths]="2" [dayTemplate]="t"
        [autoClose]="false" (click)="dp.toggle(); isOpen = !isOpen" readonly />

  <div class="form-group">
    <div class="row">
      <div class="col">
        <div class="input-group">
          <!-- value={{from}} -->
          <input class="form-control" placeholder="yyyy-mm-dd" name="dateFrom" ngbDatepicker
            id="dateFrom" #d="ngbDatepicker" value={{from}} (blur)="onBlurDateSelection()" (dateSelect)="onFromDateSelection($event)" />
          <button class="btn btn-outline-secondary bi bi-calendar3" (click)="d.toggle()" type="button"></button>
        </div>
      </div>
      <div class="col">
        <div class="input-group">
          <!-- value={{to}} -->
          <!-- [(ngModel)]="to" -->
          <input class="form-control" placeholder="yyyy-mm-dd" name="dateTo" ngbDatepicker
            id="dateTo" #dd="ngbDatepicker" value={{to}} (blur)="onBlurDateSelection()" (dateSelect)="onToDateSelection($event)" />
          <button class="btn btn-outline-secondary bi bi-calendar3" (click)="dd.toggle()" type="button"></button>
        </div>
      </div>
    </div>
  </div>
</form>
