global(workDirectory="/var/lib/piro-api-log-collector")

module(
    load="imjournal"
    StateFile="journal.state"
    PersistStateInterval="100"
    IgnorePreviousMessages="off"
    Ratelimit.Interval="0"
)

template(
    name="PiroJournalLine"
    type="string"
    string="%timereported:::date-rfc3339% %syslogtag% %msg%\n"
)

if ($!_SYSTEMD_UNIT == "piro-api.service" or ($programname == "systemd" and $!UNIT == "piro-api.service")) then {
    action(
        name="piro_api_file"
        type="omfile"
        file="/opt/piro-api/piro-api/backend/logs/runtime.log"
        template="PiroJournalLine"
        fileCreateMode="0640"
        createDirs="off"
        action.resumeRetryCount="-1"
        action.reportSuspension="on"
        queue.type="Disk"
        queue.filename="runtime"
        queue.maxDiskSpace="256m"
        queue.checkpointInterval="1"
        queue.syncQueueFiles="on"
        queue.saveOnShutdown="on"
    )
}
