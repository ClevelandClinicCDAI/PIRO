server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /assets/config.json { alias /etc/piro-ui-config.json; default_type application/json; }
    location /api/work-location/ {
        resolver 127.0.0.11 valid=10s;
        set $presence_api presence-api:8002;
        rewrite ^/api/work-location/(.*)$ /work-location/$1 break;
        proxy_pass http://$presence_api;
        proxy_set_header Host $host;
        # Synthetic dashboard reads only. Ingestion uses the loopback-only port.
        limit_except GET { deny all; }
    }
    location /api/ {
        # Keep this standalone prototype available while the main API is stopped.
        resolver 127.0.0.11 valid=10s;
        set $piro_api api:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$piro_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
