server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /assets/config.json { alias /etc/piro-ui-config.json; default_type application/json; }
    location /api/work-location/ {
        proxy_pass http://presence-api:8002/work-location/;
        proxy_set_header Host $host;
        # Synthetic dashboard reads only. Ingestion uses the loopback-only port.
        limit_except GET { deny all; }
    }
    location /api/ {
        proxy_pass http://api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
